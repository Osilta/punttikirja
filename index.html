<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#0f1115;--c:#1a1d24;--c2:#272c36;--t:#eef0f4;--m:#8b93a3;--a:#4ade80;--w:#f59e0b;--d:#f87171;padding-top:env(safe-area-inset-top,0px)}

main{max-width:640px;margin:auto;padding:12px 12px 160px}

.card{background:var(--c);border-radius:14px;padding:12px;margin:10px 0}

.btn{width:100%;margin:6px 0;font-weight:600}.pri{background:var(--a);color:#06240f}.dn{color:var(--d)}

.ic{min-width:40px;padding:6px;background:none}
.tag{background:var(--a);color:#06240f;border-radius:8px;padding:2px 8px;font-size:12px}
.set{display:grid;grid-template-columns:16px 1fr 1fr 58px 46px;gap:5px;align-items:center;margin:6px 0}
.st{display:flex;align-items:center}.st button{min-width:30px;width:30px;padding:0;border-radius:8px}

.set select{padding:10px 2px;margin:0}
.ok{padding:0;width:46px;font-size:20px;color:var(--m)}.ok.on{background:var(--a);color:#06240f}

#rb[hidden]{display:none}#rb button{min-height:36px;padding:4px 10px;background:#0002;color:#241800}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}label{font-size:12px;color:var(--m)}
.prx{border-top:1px solid #2a2f3a;padding-top:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;margin:6px 0}
